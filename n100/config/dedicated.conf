# dedicated.conf -- dedicated-exit management knobs (survives redeploys,
# same mechanism as mode.conf). Copy to /etc/surflare/dedicated.conf on
# the router. Delete the file, or set ENABLED=0, when the dedicated IP
# subscription lapses: the TUI supervisor goes inert and the watchdog's
# NODE validation falls back to the first US city automatically.
ENABLED=1
# The dedicated node in the exact "Name(ip)" form the TUI server list
# and `surflare status` render (status appends an operator suffix like
# AT&T; matching is substring so the suffix is fine). This single key
# drives BOTH the cursor walk and the post-connect verification -- it
# must uniquely identify the row (a bare IP subnet like "12.104" would
# also match a sibling dedicated node).
DED_NODE="United States(12.104.12.149)"
# Seconds a non-dedicated session must hold before the supervisor
# re-pins, so the watchdog's post-reconnect city fallback is not fought
# mid-reconnect.
GRACE_S=300
# Storm backoff: skip re-pinning when the watchdog has rotated at least
# STORM_ROT_MIN times within STORM_WINDOW_S seconds (relay-wide storm;
# every node dies fast, re-pinning only joins the flapping).
STORM_ROT_MIN=2
STORM_WINDOW_S=600
