# Connectivity check domains -- bypass tombstone REJECT
# Resolves via domestic DNS (always reachable, even during VPN tombstone)
# and populates cn_domain_ips nftset so IPs bypass the tombstone REJECT
# rule in prerouting (ip daddr @cn_domain_ips -> return).
#
# Deploy: copy to /etc/smartdns/connectivity-check.conf and
# connectivity_check.txt to /etc/smartdns/domain-set/
# Add "conf-file /etc/smartdns/connectivity-check.conf" to custom.conf
# Restart SmartDNS.
domain-set -name connectivity-check -file /etc/smartdns/domain-set/connectivity_check.txt
nameserver /domain-set:connectivity-check/domestic
domain-rules /domain-set:connectivity-check/ -nftset #4:inet#sw_lan_tproxy#cn_domain_ips,#6:inet#sw_lan_tproxy#cn6_domain_ips,#4:inet#killswitch#cn_domain_ips,#6:inet#killswitch#cn6_domain_ips
