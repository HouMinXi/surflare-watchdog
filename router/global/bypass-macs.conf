# bypass-macs.conf -- devices that bypass tproxy (use CN ISP IP directly)
# One MAC per line, # lines are comments
# IPs are auto-resolved from /tmp/dhcp.leases on each VPN connect
#
# Global mode: all LAN TCP/QUIC goes through VPN.  cn_direct sets handle
# CN destination bypass at the tproxy layer.  Devices listed here bypass
# tproxy entirely -- ALL their traffic (CN and non-CN) goes ISP direct.
#
# Use case: devices running apps that require full CN ISP connectivity
# (e.g. Thunder/Xunlei downloads, CN gaming with anti-cheat).
#
# WARNING: bypassed devices have NO VPN protection for non-CN traffic.
# Their IPs are synced to killswitch bypass_src (forward accept) and
# dns_enforce vpn_bypass (DNS exemption).
#
# AnyConnect devices MUST be listed here.  DTLS data (UDP 443) bypasses
# tproxy via the 0xfefd detection rule, but the TLS control channel
# (TCP 443) gets intercepted by tproxy -> surflare-proxy, which breaks
# the VPN tunnel.  Bypassing the entire device lets the tunnel work.
00:11:22:33:44:55   # admin-PC Windows (.11) -- Thunder/Baidu direct CN
00:66:77:88:99:aa   # Mac (.147) -- Cisco AnyConnect
