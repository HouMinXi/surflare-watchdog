# bypass-macs.conf -- MAC addresses that bypass tproxy (direct WAN path)
# One MAC per line, # lines are comments
# IPs are auto-resolved from /tmp/dhcp.leases on each VPN connect
#
# AnyConnect devices MUST be listed here.  DTLS data (UDP 443) bypasses
# tproxy via the 0xfefd detection rule, but the TLS control channel
# (TCP 443) gets intercepted by tproxy -> surflare-proxy, which breaks
# the VPN tunnel.  Bypassing the entire device lets the tunnel work.
00:11:22:33:44:55   # admin-PC Windows (.11)
00:66:77:88:99:aa   # Mac (.147) -- Cisco AnyConnect
